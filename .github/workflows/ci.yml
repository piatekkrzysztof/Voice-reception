name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voice_reception_test
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice_reception_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test SQLite and PostgreSQL
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://voice:voice_ci_password@127.0.0.1:5432/voice_reception_test

      - name: Build production image
        run: docker build --tag voice-reception:ci .
